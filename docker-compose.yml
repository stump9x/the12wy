services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      PGLITE_DATA_DIR: /app/data/pglite
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://107.161.168.82:12500}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-12500}:3000"
    volumes:
      - planner_data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  planner_data:
